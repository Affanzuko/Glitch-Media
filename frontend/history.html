<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Media - Publish History</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">G</div>
      <div class="brand-text">
        <h2>Glitch Media</h2>
        <p>AI Automation Hub</p>
      </div>
    </div>
    <ul class="nav-links">
      <li class="nav-item">
        <a href="dashboard.html" class="nav-link">DASHBOARD</a>
      </li>
      <li class="nav-item">
        <a href="history.html" class="nav-link active">HISTORY</a>
      </li>
      <li class="nav-item">
        <a href="settings.html" class="nav-link">SETTINGS</a>
      </li>
    </ul>
    <div class="sidebar-footer">
      <a href="#" class="nav-link" style="font-size: 0.8rem;">Documentation</a>
      <a href="#" class="nav-link" style="font-size: 0.8rem;">Support</a>
      <button class="btn-emergency">&#9888; EMERGENCY STOP</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    
    <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 class="text-purple" style="color: white;">Publish History</h1>
        <p class="text-muted">System Log // Transmission Records</p>
      </div>
      
      <div style="display: flex; gap: 1rem;">
        <select class="form-control" style="width: auto; background: var(--bg-dark);">
          <option>All Platforms</option>
          <option>X (Twitter)</option>
          <option>Instagram</option>
        </select>
        <input type="date" class="form-control" style="width: auto; background: var(--bg-dark);">
        <button class="btn btn-primary" style="background: linear-gradient(135deg, var(--accent-cyan), #aeeef5); color: #000; font-weight: bold;">EXPORT LOG</button>
      </div>
    </header>

    <div class="panel" style="padding: 0; overflow: hidden;">
      <table class="history-table">
        <thead style="background: rgba(255,255,255,0.02);">
          <tr>
            <th>Date / Time</th>
            <th>Payload Title</th>
            <th>Target</th>
            <th>Status</th>
            <th>Diagnostics</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <!-- Rows will be populated by JavaScript -->
        </tbody>
      </table>
      
      <div style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color);">
        <span class="text-muted" style="font-size: 0.8rem;">Showing 1-4 of 128 records</span>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; border-color: transparent;">&lt;</button>
          <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; border-color: transparent;">&gt;</button>
        </div>
      </div>
    </div>

  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
