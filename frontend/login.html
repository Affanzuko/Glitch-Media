<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Media - Login</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div style="margin-bottom: 2rem;">
        <h1>GLITCH MEDIA</h1>
        <p class="text-cyan" style="font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 0.5rem;">AI Automation Hub</p>
      </div>

      <form action="dashboard.html">
        <div class="form-group" style="text-align: left;">
          <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="color: var(--accent-cyan);">●</span> Operator ID
          </label>
          <div class="input-with-icon">
            <input type="text" class="form-control" placeholder="Enter alphanumeric code" required>
            <span class="icon" style="font-size: 1.2rem; cursor: default;">&gt;_</span>
          </div>
        </div>

        <div class="form-group" style="text-align: left; margin-bottom: 2rem;">
          <div style="display: flex; justify-content: space-between;">
            <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem;">
              <span style="color: var(--accent-purple);">●</span> Access Key
            </label>
            <a href="#" class="text-cyan" style="font-size: 0.8rem; text-decoration: none;">Forgot Access Key?</a>
          </div>
          <div class="input-with-icon">
            <input type="password" class="form-control" placeholder="••••••••••••" required>
            <span class="icon" style="font-size: 1.2rem;">&#128065;</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;">
          INITIATE SESSION &rarr;
        </button>

        <div style="display: flex; align-items: center; margin: 1.5rem 0;">
          <hr style="flex: 1; border-color: rgba(255,255,255,0.1); border-style: solid;">
          <span style="padding: 0 1rem; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Connect Via Neural Link</span>
          <hr style="flex: 1; border-color: rgba(255,255,255,0.1); border-style: solid;">
        </div>

        <div style="display: flex; gap: 1rem;">
          <button type="button" class="btn btn-outline" style="flex: 1;">G</button>
          <button type="button" class="btn btn-outline" style="flex: 1;">Git</button>
        </div>

      </form>
      
      <p style="margin-top: 2rem; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">
        &copy; 2026 GLITCH MEDIA // SECURED ACCESS
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
