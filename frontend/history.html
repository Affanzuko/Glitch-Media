<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Media - Publish History</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">G</div>
      <div class="brand-text">
        <h2>Glitch Media</h2>
        <p>AI Automation Hub</p>
      </div>
    </div>
    <ul class="nav-links">
      <li class="nav-item">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
      </li>
      <li class="nav-item">
        <a href="history.html" class="nav-link active">History</a>
      </li>
      <li class="nav-item">
        <a href="settings.html" class="nav-link">Settings</a>
      </li>
    </ul>
    <!-- <div class="sidebar-footer">
      <button class="btn-emergency">&#9888; EMERGENCY STOP</button>
    </div> -->
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 class="text-purple" style="color: white;">Publish History</h1>
        <p class="text-muted">System Log // Transmission Records</p>
      </div>

      <!-- <div style="display: flex; gap: 1rem;">
        <select class="form-control" style="width: auto; background: var(--bg-dark);">
          <option>All Platforms</option>
          <option>X (Twitter)</option>
          <option>Instagram</option>
        </select>
        <input type="date" class="form-control" style="width: auto; background: var(--bg-dark);">
        <button class="btn btn-primary"
          style="background: linear-gradient(135deg, var(--accent-cyan), #aeeef5); color: #000; font-weight: bold;">EXPORT
          LOG</button>
      </div> -->
    </header>

    <div class="panel" style="padding: 0; overflow: hidden;">
      <table class="history-table">
        <thead style="background: rgba(255,255,255,0.02);">
          <tr>
            <th>Date / Time</th>
            <th>Payload Title</th>
            <th>Target</th>
            <th>Status</th>
            <th>Diagnostics</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <!-- Rows will be populated by JavaScript -->
        </tbody>
      </table>

      <div
        style="padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color);">
        <span class="text-muted" style="font-size: 0.8rem;">Showing 1-4 of 128 records</span>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; border-color: transparent;">&lt;</button>
          <button class="btn btn-outline" style="padding: 0.3rem 0.6rem; border-color: transparent;">&gt;</button>
        </div>
      </div>
    </div>

  </main>

  <!-- History Publish Popup Overlay -->
  <div id="history-popup-overlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box;">
    <div id="history-publish-panel" class="panel"
      style="width: 100%; max-width: 1000px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--accent-purple); box-shadow: 0 0 20px rgba(182, 36, 255, 0.2); background: var(--bg-dark); border-radius: 12px; margin: auto;">
      <h3 style="display: flex; align-items: center; gap: 0.5rem; color: #fff; margin-bottom: 2rem;">
        Publish Unpublished Agent <span id="hist-news-title"
          style="font-size: 0.9rem; color: var(--text-muted); font-weight: normal; margin-left: auto;"></span>
      </h3>

      <div class="hitl-grid">
        <!-- Captions Column -->
        <div>
          <div class="form-group">
            <label class="form-label">X (TWITTER) CAPTION</label>
            <textarea id="hist-caption-x" class="form-control" style="min-height: 200px;"></textarea>
          </div>
          <div class="form-group" style="margin-top: 1.5rem;">
            <label class="form-label">INSTAGRAM CAPTION</label>
            <textarea id="hist-caption-ig" class="form-control" style="min-height: 315px;"></textarea>
          </div>
        </div>

        <!-- Image Preview Column -->
        <div>
          <label class="form-label">IMAGE PREVIEW</label>
          <div class="image-preview" style="background: transparent;">
            <img id="hist-image" src="" alt="AI Generated Preview"
              style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px; display: none;">
            <div id="hist-image-placeholder"
              style="width: 100%; height: 100%; background: linear-gradient(45deg, #12002b, #002b36, #200022); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; border-radius: 8px;">
              <span style="font-size: 3rem; opacity: 0.5;">🌃</span>
              <span style="color: var(--text-muted); font-size: 0.8rem;">NO IMAGE PREVIEW</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="hitl-actions" style="margin-top: 2rem;">
        <button id="btn-hist-cancel" class="btn btn-outline"
          style="color: var(--accent-red); border-color: rgba(255,51,102,0.3);">CANCEL</button>
        <button id="btn-hist-regen" class="btn btn-outline">REGENERATE IMAGE</button>
        <button id="btn-hist-publish" class="btn btn-primary"
          style="background: rgba(182,36,255,0.2); border: 1px solid var(--accent-purple);">PUBLISH</button>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>

</html>
